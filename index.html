<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Arcade Portal</title>
    <style>
        :root { --bg: #0f0c1b; --card: #1d1833; --accent: #a855f7; --text: #ffffff; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        header { text-align: center; margin-bottom: 40px; }
        h1 { color: var(--accent); font-size: 2.5rem; margin: 0; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .game-card { background: var(--card); border-radius: 12px; padding: 40px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); cursor: pointer; text-align: center; font-weight: bold; text-transform: uppercase; transition: transform 0.2s; }
        .game-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(168,85,247,0.4); }
        
        /* Theatre Player Overlay Layout */
        .game-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); z-index: 1000; flex-direction: column; }
        .modal-controls { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #0b0914; border-bottom: 1px solid #231b40; }
        .control-buttons { display: flex; gap: 10px; }
        
        /* Interactive Buttons Style */
        .action-btn { background: #2a244d; color: white; border: 1px solid #4c3e7a; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .action-btn:hover { background: #3b336a; }
        .close-btn { background: var(--accent); border-color: var(--accent); }
        .close-btn:hover { background: #b567ff; }

        .iframe-container { flex-grow: 1; width: 100%; height: calc(100% - 60px); position: relative; }
        iframe { width: 100%; height: 100%; border: none; background: #000; display: block; }

        /* CSS CSS-based Fullscreen override mode */
        .game-modal.css-fullscreen {
            position: fixed !important;
            top: 0 !important; left: 0 !important;
            width: 100vw !important; height: 100vh !important;
            z-index: 99999 !important;
        }
        .game-modal.css-fullscreen .modal-controls {
            display: none !important; /* Hides top control bar in true maximum view */
        }
        .game-modal.css-fullscreen .iframe-container {
            height: 100vh !important;
        }

        /* Floating Exit button for CSS Fullscreen mode on mobile */
        .floating-exit-btn {
            display: none;
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 100000;
            background: rgba(168, 85, 247, 0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <header>
        <h1>MY ARCADE</h1>
        <p>Play independent web games instantly inside iframe theatre mode</p>
    </header>

    <main class="game-grid" id="gameGrid">Loading arcade cabinet...</main>

    <!-- Overlay Theatre Player Frame -->
    <div class="game-modal" id="gameModal">
        <div class="modal-controls">
            <span style="font-size: 1.3rem; font-weight: bold; color: var(--accent);" id="activeTitle">Game Player</span>
            <div class="control-buttons">
                <button class="action-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
                <button class="action-btn close-btn" onclick="closeGame()">✕ Close Game</button>
            </div>
        </div>
        <div class="iframe-container">
            <iframe id="gameFrame" allow="autoplay; gamepad; fullscreen; screen-wake-lock;" allowfullscreen></iframe>
        </div>
    </div>

    <!-- Floating Back button when header is hidden -->
    <button class="floating-exit-btn" id="floatingExit" onclick="toggleFullscreen()">✕</button>

    <script>
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQBaztnaD1I_SMxLCmZLuvN3Ac08AofppS-EejonWALQ7g8EULniEWPrbnmo6GuACKUsGftDhOtDQ_p/pub?output=csv";

        function parseCsvRow(rowText) {
            let cells = [];
            let currentCell = '';
            let inQuotes = false;
            for (let i = 0; i < rowText.length; i++) {
                let char = rowText[i];
                if (char === '"') { inQuotes = !inQuotes; }
                else if (char === ',' && !inQuotes) { cells.push(currentCell.trim()); currentCell = ''; }
                else { currentCell += char; }
            }
            cells.push(currentCell.trim());
            return cells;
        }

        async function loadArcadeFromGoogleSheet() {
            try {
                const response = await fetch(GOOGLE_SHEET_CSV_URL);
                const data = await response.text();
                const rows = data.split(/\r?\n/).slice(1);
                const grid = document.getElementById('gameGrid');
                let htmlContent = "";
                
                rows.forEach(row => {
                    if (!row.trim()) return;
                    const columns = parseCsvRow(row);
                    if(columns.length >= 3) {
                        const title = columns[1]; 
                        const url = columns[2];   
                        
                        if(title && url && (url.startsWith('http://') || url.startsWith('https://'))) {
                            htmlContent += `
                                <div class="game-card" onclick="openGame('${url}', '${title.replace(/'/g, "\\'")}')">
                                    🕹️ <br><br> ${title}
                                </div>
                            `;
                        }
                    }
                });
                grid.innerHTML = htmlContent || `<p style="grid-column:1/-1; text-align:center; color:#888;">No games active yet.</p>`;
            } catch (err) {
                console.error(err);
            }
        }

        function openGame(url, title) {
            document.getElementById('activeTitle').innerText = title;
            document.getElementById('gameFrame').src = url;
            document.getElementById('gameModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeGame() {
            const modal = document.getElementById('gameModal');
            modal.classList.remove('css-fullscreen');
            document.getElementById('floatingExit').style.display = 'none';
            modal.style.display = 'none';
            document.getElementById('gameFrame').src = '';
            document.body.style.overflow = 'auto';
        }

        // Bulletproof CSS Fullscreen Toggle Method
        function toggleFullscreen() {
            const modal = document.getElementById('gameModal');
            const floatingExit = document.getElementById('floatingExit');
            
            if (!modal.classList.contains('css-fullscreen')) {
                // Force full device screen layout size overlay
                modal.classList.add('css-fullscreen');
                floatingExit.style.display = 'flex'; // Show floating close cross button
            } else {
                // Drop out of maximum layout back to theatre menu box
                modal.classList.remove('css-fullscreen');
                floatingExit.style.display = 'none';
            }
        }

        window.addEventListener('DOMContentLoaded', loadArcadeFromGoogleSheet);
    </script>
</body>
</html>
