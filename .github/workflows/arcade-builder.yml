name: Arcade Database Engine

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  add-game-to-portal:
    if: contains(github.event.issue.labels.*.name, 'new-game')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Files
        uses: actions/checkout@v4

      # Highly stable, official community parser
      - name: Parse Form Content
        id: parse
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/add-game.yml

      # Safely inject values using environment tokens to avoid breakages from special characters
      - name: Inject into JSON database
        env:
          GAME_TITLE: ${{ steps.parse.outputs.issueparser_game_name }}
          GAME_URL: ${{ steps.parse.outputs.issueparser_game_url }}
        run: |
          if [ ! -f games.json ]; then
            echo "[]" > games.json
          fi
          
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("games.json", "utf8"));
            data.push({
              title: process.env.GAME_TITLE,
              url: process.env.GAME_URL
            });
            fs.writeFileSync("games.json", JSON.stringify(data, null, 2));
          '

      - name: Commit and Save Permanently
        run: |
          git config --global user.name "Arcade Bot"
          git config --global user.email "arcadebot@github.com"
          git add games.json
          git commit -m "Successfully linked game"
          git push

      - name: Close Form
        run: |
          gh issue close ${{ github.event.issue.number }} --reason "completed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
